name: ci

# 單元測試(引擎、資料管線、部署設定)。瀏覽器端對端測試需要 Chromium,在自己的電腦跑(見 README)。
on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Engine tests
        run: npm test

      - name: Data pipeline and workflow tests
        run: python -m pytest -q
