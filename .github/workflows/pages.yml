name: deploy-site

# 把 site/ 部署成公開網站(GitHub Pages),並在部署前抓最新的價格資料。
#
# 目前「只能手動執行」: 這個 repo 還沒有開啟 Pages(需要在 Settings → Pages → Source 選「GitHub Actions」,
# 這一步沒有辦法由 Actions 自己完成),所以不讓 push 與排程自動觸發,免得每次都跑出紅燈。
# 真的要公開部署時: 先開啟 Pages,再把下面的 on: 還原成 push + schedule(見 docs 的「部署」一節)。
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只部署一次;不取消進行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      # 失敗(通過品質檢查的標的不到一半)時這個步驟會讓整個 workflow 失敗,
      # 已經發布的網站維持上一次的版本,不會被空資料取代。
      - name: Fetch prices (with data-quality gate)
        run: python tools/fetch_prices.py --out site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
